<style>

/* =========================
   MOBILE HEADER FIX
========================= */

@media (max-width:768px){

  .top{
    padding:0;
    background:#f5f1e8;
  }

  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    gap:12px;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    flex:1;
    min-width:0;
  }

  .logo-mark{
    width:54px;
    height:auto;
    flex-shrink:0;
  }

  .logo-word{
    font-size:28px !important;
    line-height:1;
    letter-spacing:.08em;
  }

  .logo-sub{
    font-size:10px !important;
    letter-spacing:.22em;
  }

  .nav-right{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .btn.btn-dark.no-arrow{
    display:none !important;
  }

  .nav-call-mobile{
    display:flex !important;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
  }

  .menu-toggle{
    display:flex !important;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    width:44px;
    height:44px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:99999;
  }

  .menu-toggle span{
    display:block;
    width:24px;
    height:2px;
    background:#111;
    margin:3px 0;
    transition:.3s ease;
  }

  .menu-toggle.is-open span:nth-child(1){
    transform:translateY(8px) rotate(45deg);
  }

  .menu-toggle.is-open span:nth-child(2){
    opacity:0;
  }

  .menu-toggle.is-open span:nth-child(3){
    transform:translateY(-8px) rotate(-45deg);
  }

  .nav-links{
    position:fixed;
    top:82px;
    left:0;
    right:0;
    background:#f5f1e8;
    display:flex;
    flex-direction:column;
    gap:22px;
    padding:28px;
    border-top:1px solid rgba(0,0,0,.08);

    transform:translateY(-120%);
    opacity:0;
    visibility:hidden;

    transition:.35s ease;

    z-index:9999;
  }

  .nav-links.open{
    transform:translateY(0);
    opacity:1;
    visibility:visible;
  }

  .nav-links a{
    font-size:15px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  /* HERO */

  .home-hero{
    padding-top:40px !important;
  }

  .home-hero-grid{
    grid-template-columns:1fr !important;
    gap:34px;
  }

  .home-hero h1{
    font-size:64px !important;
    line-height:.92 !important;
  }

  .home-hero p{
    font-size:16px !important;
    line-height:1.7;
  }

  .home-hero-cta{
    flex-wrap:wrap;
  }

  .home-hero-visual{
    aspect-ratio:4/5;
    overflow:hidden;
  }

  .home-hero-visual img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* PROJECTS */

  .projects-grid{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:18px;
    height:auto !important;
  }

  .proj-tile{
    aspect-ratio:4/5 !important;
  }

  .proj-tile.featured{
    aspect-ratio:4/5 !important;
    grid-column:auto !important;
  }

  .proj-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .proj-tile .meta h4{
    font-size:26px;
  }

  /* ABOUT */

  .about-split{
    grid-template-columns:1fr !important;
    gap:36px;
  }

  .about-left h2{
    font-size:44px !important;
    line-height:1;
  }

  /* SERVICES */

  .services-grid{
    grid-template-columns:1fr !important;
  }

  /* CTA */

  .cta-band{
    padding:70px 0 !important;
  }

  .cta-band h2{
    font-size:42px !important;
    line-height:1.05;
  }

  /* FLOAT BUTTON */

  .fab-call{
    right:10px;
    bottom:10px;
    transform:scale(.92);
  }

}

/* =========================
   IMAGE FIX
========================= */

img{
  max-width:100%;
  height:auto;
}

/* prevents SVG/image collapse */
.proj-tile img,
.about-right img,
.home-hero-visual img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

</style>

<script>

/* =========================
   MOBILE MENU FIX
========================= */

(function(){

  const btn = document.getElementById('menuToggle');
  const menu = document.getElementById('navLinks');

  if(!btn || !menu) return;

  btn.addEventListener('click', function(e){

    e.preventDefault();
    e.stopPropagation();

    menu.classList.toggle('open');

    btn.classList.toggle('is-open');

  });

  document.querySelectorAll('#navLinks a').forEach(function(link){

    link.addEventListener('click', function(){

      menu.classList.remove('open');
      btn.classList.remove('is-open');

    });

  });

  document.addEventListener('click', function(e){

    if(
      !menu.contains(e.target) &&
      !btn.contains(e.target)
    ){
      menu.classList.remove('open');
      btn.classList.remove('is-open');
    }

  });

})();

/* =========================
   IMAGE FALLBACK
========================= */

document.querySelectorAll('img').forEach(function(img){

  img.loading = "lazy";

  img.onerror = function(){

    console.log("Missing image:", img.src);

    img.src =
    "https://placehold.co/1200x800/f5f1e8/111111?text=2:20+Partners";

  };

});

</script>
