<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Kotebe House, a G+1 residence with basement in Kotebe 02, Addis Ababa, by 2:20 Partners.">

  <title>Kotebe House | 2:20 Partners</title>

  <link rel="stylesheet" href="../assets/site.css?v=8">

  <style>
    .ayat-hero {
      padding: 80px 0 55px;
      background: var(--cream);
    }

    .ayat-hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 300;
      margin: 25px 0 15px;
    }

    .ayat-hero .it {
      color: var(--gold);
      font-style: italic;
    }

    .ayat-description {
      max-width: 700px;
      color: var(--ink-mid);
      font-size: 16px;
      line-height: 1.8;
    }

    .ayat-media {
      padding: 50px 0 90px;
    }

    .ayat-media h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 400;
      margin-bottom: 25px;
    }

    .ayat-photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .ayat-photo-grid img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .ayat-back {
      margin-top: 45px;
    }

    @media (max-width: 768px) {
      .ayat-hero {
        padding: 55px 0 35px;
      }

      .ayat-photo-grid {
        grid-template-columns: 1fr;
      }

      .ayat-photo-grid img {
        height: 260px;
      }

      .ayat-media h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<section class="ayat-hero">
  <div class="container">

    <div class="crumbs">
      <a href="../">Home</a>
      <span class="sep">/</span>
      <a href="./">Projects</a>
      <span class="sep">/</span>
      <span>Kotebe House</span>
    </div>

    <div class="eyebrow">Residential · December 2019</div>

    <h1>Kotebe <span class="it">House</span></h1>

    <p class="ayat-description">
      A G+1 residential house with a basement, located in
      Kotebe 02, Addis Ababa, on a 540 m² site.
      Completed in December 2019.
    </p>

  </div>
</section>

<section class="ayat-media">
  <div class="container">

    <h2>Project <span class="it">Gallery</span></h2>

    <div class="ayat-photo-grid">

      <img
        src="../images/projects/kotebe-residence.jpg?v=2"
        alt="Kotebe House - Main View"
        loading="lazy"
      >

      <img
        src="../images/projects/kotebe-residence-2.jpg"
        alt="Kotebe House - Additional View 2"
        loading="lazy"
      >

      <img
        src="../images/projects/kotebe-residence-3.jpg"
        alt="Kotebe House - Additional View 3"
        loading="lazy"
      >

      <img
        src="../images/projects/kotebe-residence-4.jpg"
        alt="Kotebe House - Additional View 4"
        loading="lazy"
      >

      <img
        src="../images/projects/kotebe-residence-5.jpg"
        alt="Kotebe House - Additional View 4"
        loading="lazy"
      >

      <img
        src="../images/projects/kotebe-residence-6.jpg"
        alt="Kotebe House - Additional View 4"
        loading="lazy"
      >

    </div>

    <div class="ayat-back">
      <a href="./" class="btn btn-dark">← Back to Projects</a>
    </div>

  </div>
</section>

<script src="../assets/nav.js" defer></script>

</body>
</html>
