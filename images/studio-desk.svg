<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wood-desk" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8a6a3e"/>
      <stop offset="50%" stop-color="#6b4f2c"/>
      <stop offset="100%" stop-color="#3d2a16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4d491"/>
      <stop offset="100%" stop-color="#a8842e"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wood-grain" x="0" y="0" width="200" height="6" patternUnits="userSpaceOnUse">
      <rect width="200" height="6" fill="url(#wood-desk)"/>
      <line x1="0" y1="3" x2="200" y2="3" stroke="#3a2814" stroke-width="0.4" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- desk surface -->
  <rect width="1200" height="800" fill="url(#wood-grain)"/>
  <!-- ambient lamp glow -->
  <ellipse cx="280" cy="380" rx="380" ry="320" fill="url(#lamp-glow)"/>
  <!-- blueprint paper -->
  <g transform="translate(640,160) rotate(8)">
    <rect x="0" y="0" width="380" height="500" fill="#a3b9c4" opacity="0.92"/>
    <!-- blueprint lines -->
    <g stroke="#1c3a4a" stroke-width="0.6" opacity="0.7">
      <line x1="20" y1="40" x2="360" y2="40"/>
      <line x1="20" y1="60" x2="360" y2="60"/>
      <line x1="20" y1="80" x2="360" y2="80"/>
      <rect x="60" y="120" width="120" height="160" fill="none" stroke="#1c3a4a"/>
      <rect x="180" y="120" width="160" height="160" fill="none" stroke="#1c3a4a"/>
      <line x1="60" y1="200" x2="340" y2="200"/>
      <rect x="80" y="320" width="100" height="80" fill="none"/>
      <rect x="200" y="320" width="120" height="80" fill="none"/>
      <circle cx="150" cy="440" r="30" fill="none"/>
      <text x="20" y="20" font-family="monospace" font-size="10" fill="#1c3a4a">2:20 PARTNERS — VILLA PLAN A-01</text>
      <text x="20" y="480" font-family="monospace" font-size="9" fill="#1c3a4a">SCALE 1:100  ·  ADDIS ABABA  ·  2026</text>
    </g>
  </g>
  <!-- building model (massing study) -->
  <g transform="translate(180,400)">
    <!-- base -->
    <rect x="-20" y="160" width="280" height="20" fill="#3d2a16"/>
    <!-- main mass -->
    <polygon points="0,0 200,0 240,40 240,160 0,160" fill="#e8dcc4"/>
    <polygon points="200,0 240,40 240,160 200,160" fill="#a89880"/>
    <!-- windows -->
    <rect x="20" y="40" width="40" height="30" fill="#1c1a16" opacity="0.7"/>
    <rect x="80" y="40" width="40" height="30" fill="#1c1a16" opacity="0.7"/>
    <rect x="140" y="40" width="40" height="30" fill="#1c1a16" opacity="0.7"/>
    <rect x="20" y="100" width="40" height="40" fill="#1c1a16" opacity="0.7"/>
    <rect x="140" y="100" width="40" height="40" fill="#1c1a16" opacity="0.7"/>
    <rect x="80" y="100" width="40" height="40" fill="url(#brass)" opacity="0.85"/>
    <!-- roof box -->
    <rect x="60" y="-50" width="100" height="50" fill="#a89880"/>
    <polygon points="160,-50 200,-30 200,0 160,0" fill="#7a6a52"/>
    <!-- shadow -->
    <ellipse cx="120" cy="180" rx="160" ry="14" fill="#1c1a16" opacity="0.45"/>
  </g>
  <!-- brass desk lamp -->
  <g transform="translate(820,80)">
    <!-- base -->
    <ellipse cx="0" cy="220" rx="46" ry="14" fill="#3d2a16"/>
    <rect x="-20" y="215" width="40" height="10" fill="url(#brass)"/>
    <!-- arm -->
    <line x1="0" y1="215" x2="-90" y2="100" stroke="url(#brass)" stroke-width="6"/>
    <line x1="-90" y1="100" x2="-150" y2="160" stroke="url(#brass)" stroke-width="6"/>
    <!-- shade -->
    <polygon points="-180,150 -100,150 -120,200 -160,200" fill="url(#brass)"/>
    <ellipse cx="-140" cy="200" rx="22" ry="6" fill="#fff5d6" opacity="0.8"/>
  </g>
  <!-- material samples (wood, stone) -->
  <g transform="translate(120,140) rotate(-12)">
    <!-- wood sample -->
    <rect x="0" y="0" width="120" height="80" fill="#6b4f2c"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="#3d2a16" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#3d2a16" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#3d2a16" stroke-width="0.5"/>
    <text x="6" y="76" font-family="DM Sans, sans-serif" font-size="8" fill="#f2ece1" letter-spacing="2">WANZA</text>
  </g>
  <g transform="translate(280,160) rotate(-6)">
    <rect x="0" y="0" width="120" height="80" fill="#7a6c52"/>
    <rect x="0" y="0" width="60" height="40" fill="#5e5240"/>
    <rect x="60" y="40" width="60" height="40" fill="#65583f"/>
    <text x="6" y="76" font-family="DM Sans, sans-serif" font-size="8" fill="#f2ece1" letter-spacing="2">DRY-STACK STONE</text>
  </g>
  <!-- pencil sketch -->
  <g transform="translate(440,540) rotate(-4)" opacity="0.85">
    <rect x="0" y="0" width="240" height="140" fill="#f5edda"/>
    <g stroke="#1c1a16" stroke-width="0.7" fill="none" opacity="0.7">
      <line x1="20" y1="100" x2="220" y2="100"/>
      <polygon points="40,100 80,40 120,40 120,100"/>
      <polygon points="120,100 120,40 160,40 200,80 200,100"/>
      <line x1="50" y1="60" x2="60" y2="60"/>
      <line x1="50" y1="75" x2="60" y2="75"/>
      <line x1="90" y1="60" x2="100" y2="60"/>
      <line x1="170" y1="80" x2="180" y2="80"/>
    </g>
  </g>
  <!-- rolled trace paper -->
  <g transform="translate(60,580) rotate(-6)">
    <ellipse cx="0" cy="0" rx="40" ry="12" fill="#f5edda"/>
    <rect x="-40" y="0" width="80" height="160" fill="#f5edda"/>
    <ellipse cx="0" cy="160" rx="40" ry="12" fill="#e8dcc4"/>
    <line x1="-30" y1="40" x2="30" y2="40" stroke="#c8a96e" stroke-width="2"/>
    <line x1="-25" y1="60" x2="25" y2="60" stroke="#c8a96e" stroke-width="1"/>
  </g>
  <!-- coffee cup -->
  <g transform="translate(960,560)">
    <ellipse cx="0" cy="60" rx="38" ry="10" fill="#1c1a16" opacity="0.55"/>
    <rect x="-35" y="0" width="70" height="60" fill="#e8dcc4" rx="4"/>
    <ellipse cx="0" cy="0" rx="35" ry="9" fill="#3d2a16"/>
    <path d="M35,15 Q60,25 60,40 Q60,55 35,50" fill="none" stroke="#e8dcc4" stroke-width="6"/>
  </g>
  <!-- subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#vignette)"/>
</svg>
