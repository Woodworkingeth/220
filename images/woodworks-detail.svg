<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wood-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6b4f2c"/>
      <stop offset="100%" stop-color="#2a1a0c"/>
    </linearGradient>
    <linearGradient id="wood-light" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#a8845a"/>
      <stop offset="50%" stop-color="#8a6a3e"/>
      <stop offset="100%" stop-color="#6b4f2c"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wood-bg)"/>
  <rect width="1200" height="800" fill="url(#warm-glow)"/>
  <!-- close-up of cabinetry detail -->
  <g transform="translate(0,140)">
    <!-- cabinet face panels -->
    <rect x="0" y="0" width="600" height="500" fill="url(#wood-light)"/>
    <rect x="600" y="0" width="600" height="500" fill="url(#wood-light)" opacity="0.85"/>
    <!-- wood grain lines -->
    <g stroke="#3d2a16" stroke-width="0.7" opacity="0.55">
      <path d="M0,40 Q300,38 600,42 T1200,40"/>
      <path d="M0,80 Q300,82 600,78 T1200,82"/>
      <path d="M0,140 Q300,138 600,142 T1200,140"/>
      <path d="M0,200 Q300,202 600,198 T1200,202"/>
      <path d="M0,260 Q300,258 600,262 T1200,260"/>
      <path d="M0,320 Q300,322 600,318 T1200,322"/>
      <path d="M0,380 Q300,378 600,382 T1200,380"/>
      <path d="M0,440 Q300,442 600,438 T1200,442"/>
    </g>
    <!-- vertical seams between cabinet doors -->
    <line x1="300" y1="0" x2="300" y2="500" stroke="#1c0e08" stroke-width="3"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#1c0e08" stroke-width="4"/>
    <line x1="900" y1="0" x2="900" y2="500" stroke="#1c0e08" stroke-width="3"/>
    <!-- horizontal seam (drawer line) -->
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#1c0e08" stroke-width="2"/>
    <!-- brass pulls -->
    <g fill="#c8a96e">
      <rect x="120" y="80" width="80" height="6" rx="3"/>
      <rect x="420" y="80" width="80" height="6" rx="3"/>
      <rect x="720" y="80" width="80" height="6" rx="3"/>
      <rect x="1020" y="80" width="80" height="6" rx="3"/>
      <circle cx="150" cy="320" r="4"/>
      <circle cx="450" cy="320" r="4"/>
      <circle cx="750" cy="320" r="4"/>
      <circle cx="1050" cy="320" r="4"/>
    </g>
  </g>
  <!-- counter top stone -->
  <g transform="translate(0,100)">
    <rect x="0" y="0" width="1200" height="40" fill="#3a3122"/>
    <rect x="0" y="0" width="1200" height="6" fill="#65583f"/>
  </g>
  <!-- wall behind -->
  <rect x="0" y="0" width="1200" height="100" fill="#1c1410"/>
  <!-- pendant light -->
  <g transform="translate(720,0)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#3a2814" stroke-width="2"/>
    <ellipse cx="0" cy="60" rx="40" ry="20" fill="#c8a96e"/>
    <ellipse cx="0" cy="78" rx="40" ry="6" fill="#a8842e"/>
    <ellipse cx="0" cy="80" rx="32" ry="8" fill="#fff5d6" opacity="0.85"/>
  </g>
  <!-- vignette -->
  <radialGradient id="vig-w" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#vig-w)"/>
</svg>
