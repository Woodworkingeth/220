<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-ap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d1a14"/>
      <stop offset="100%" stop-color="#5a4830"/>
    </linearGradient>
    <linearGradient id="wood-slat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#6b4f2c"/>
      <stop offset="100%" stop-color="#8a6a3e"/>
    </linearGradient>
    <linearGradient id="warm-ap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe2a1"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky-ap)"/>
  <!-- distant trees -->
  <g opacity="0.5">
    <path d="M0,820 Q120,790 240,820 L240,900 L0,900 Z" fill="#0e0c08"/>
    <path d="M560,830 Q680,800 800,820 L800,900 L560,900 Z" fill="#0e0c08"/>
  </g>
  <!-- main slim apartment -->
  <g transform="translate(220,160)">
    <!-- core white plaster -->
    <rect x="0" y="0" width="360" height="720" fill="#e8dcc4"/>
    <rect x="-4" y="-6" width="368" height="8" fill="#3d3424"/>
    <!-- vertical wood slats spanning the facade -->
    <g>
      <rect x="20" y="20" width="14" height="680" fill="url(#wood-slat)"/>
      <rect x="40" y="20" width="14" height="680" fill="url(#wood-slat)" opacity="0.85"/>
      <rect x="60" y="20" width="14" height="680" fill="url(#wood-slat)" opacity="0.95"/>
      <rect x="80" y="20" width="14" height="680" fill="url(#wood-slat)" opacity="0.78"/>
      <rect x="100" y="20" width="14" height="680" fill="url(#wood-slat)"/>
      <rect x="120" y="20" width="14" height="680" fill="url(#wood-slat)" opacity="0.82"/>
      <rect x="140" y="20" width="14" height="680" fill="url(#wood-slat)" opacity="0.92"/>
    </g>
    <!-- glass column on right -->
    <rect x="170" y="20" width="180" height="680" fill="#1c1a16" opacity="0.86"/>
    <!-- floor lines -->
    <line x1="0" y1="180" x2="360" y2="180" stroke="#0d0b08" stroke-width="2" opacity="0.45"/>
    <line x1="0" y1="360" x2="360" y2="360" stroke="#0d0b08" stroke-width="2" opacity="0.45"/>
    <line x1="0" y1="540" x2="360" y2="540" stroke="#0d0b08" stroke-width="2" opacity="0.45"/>
    <!-- warm-lit floors behind glass -->
    <rect x="180" y="60" width="160" height="100" fill="url(#warm-ap)" opacity="0.7"/>
    <rect x="180" y="240" width="160" height="100" fill="url(#warm-ap)" opacity="0.85"/>
    <rect x="180" y="420" width="160" height="100" fill="url(#warm-ap)" opacity="0.6"/>
    <rect x="180" y="600" width="160" height="100" fill="url(#warm-ap)" opacity="0.78"/>
    <!-- vertical seams in glass -->
    <line x1="240" y1="20" x2="240" y2="700" stroke="#0d0b08" stroke-width="1.5" opacity="0.4"/>
    <line x1="290" y1="20" x2="290" y2="700" stroke="#0d0b08" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- ground -->
  <rect x="0" y="880" width="800" height="120" fill="#0c0a06"/>
  <rect x="0" y="880" width="800" height="2" fill="#c8a96e" opacity="0.4"/>
  <!-- foreground tree silhouette -->
  <g transform="translate(80,720)" opacity="0.85">
    <line x1="0" y1="0" x2="-2" y2="160" stroke="#0d0b08" stroke-width="4"/>
    <circle cx="-10" cy="-10" r="50" fill="#0d0b08"/>
    <circle cx="20" cy="-30" r="40" fill="#0d0b08"/>
    <circle cx="-30" cy="-50" r="36" fill="#0d0b08"/>
  </g>
</svg>
