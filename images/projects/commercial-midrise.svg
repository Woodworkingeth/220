<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-cm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1812"/>
      <stop offset="40%" stop-color="#2d2519"/>
      <stop offset="100%" stop-color="#5a4423"/>
    </linearGradient>
    <linearGradient id="stone-cm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a6c52"/>
      <stop offset="50%" stop-color="#5e5240"/>
      <stop offset="100%" stop-color="#3d3424"/>
    </linearGradient>
    <linearGradient id="glow-cm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4d491" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="stonePattern" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="url(#stone-cm)"/>
      <rect x="0" y="0" width="40" height="20" fill="#65583f" opacity="0.4"/>
      <rect x="40" y="20" width="40" height="20" fill="#5a4d36" opacity="0.5"/>
      <line x1="0" y1="20" x2="80" y2="20" stroke="#1c1a16" stroke-width="0.5" opacity="0.5"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#1c1a16" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="20" x2="0" y2="40" stroke="#1c1a16" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- sky -->
  <rect width="800" height="1000" fill="url(#sky-cm)"/>
  <!-- stars/lights -->
  <g opacity="0.6">
    <circle cx="120" cy="180" r="1" fill="#fff"/>
    <circle cx="320" cy="120" r="0.8" fill="#fff"/>
    <circle cx="540" cy="200" r="1" fill="#fff"/>
    <circle cx="700" cy="100" r="0.6" fill="#fff"/>
    <circle cx="650" cy="240" r="0.8" fill="#fff"/>
  </g>
  <!-- silhouette skyline far -->
  <g opacity="0.35">
    <rect x="0" y="650" width="60" height="120" fill="#1a1812"/>
    <rect x="60" y="600" width="80" height="170" fill="#1a1812"/>
    <rect x="660" y="640" width="60" height="130" fill="#1a1812"/>
    <rect x="720" y="610" width="80" height="160" fill="#1a1812"/>
  </g>
  <!-- main mid-rise building -->
  <g transform="translate(160,220)">
    <!-- mass -->
    <rect x="0" y="0" width="480" height="660" fill="url(#stonePattern)"/>
    <!-- top cornice -->
    <rect x="-12" y="-14" width="504" height="14" fill="#3d3424"/>
    <!-- glass strip vertical center -->
    <rect x="180" y="0" width="120" height="660" fill="#2a2418" opacity="0.85"/>
    <!-- balconies / window rows -->
    <g>
      <!-- 5 floors -->
      <g transform="translate(0,80)"><rect x="20" y="0" width="60" height="36" fill="#231e16"/><rect x="100" y="0" width="60" height="36" fill="#231e16"/><rect x="320" y="0" width="60" height="36" fill="#231e16"/><rect x="400" y="0" width="60" height="36" fill="#231e16"/></g>
      <g transform="translate(0,200)"><rect x="20" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.85"/><rect x="100" y="0" width="60" height="36" fill="#231e16"/><rect x="320" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.7"/><rect x="400" y="0" width="60" height="36" fill="#231e16"/></g>
      <g transform="translate(0,320)"><rect x="20" y="0" width="60" height="36" fill="#231e16"/><rect x="100" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.9"/><rect x="320" y="0" width="60" height="36" fill="#231e16"/><rect x="400" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.8"/></g>
      <g transform="translate(0,440)"><rect x="20" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.75"/><rect x="100" y="0" width="60" height="36" fill="#231e16"/><rect x="320" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.85"/><rect x="400" y="0" width="60" height="36" fill="#231e16"/></g>
      <g transform="translate(0,560)"><rect x="20" y="0" width="60" height="36" fill="#231e16"/><rect x="100" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.7"/><rect x="320" y="0" width="60" height="36" fill="#231e16"/><rect x="400" y="0" width="60" height="36" fill="url(#glow-cm)" opacity="0.6"/></g>
    </g>
    <!-- vertical glass window glow lines -->
    <g opacity="0.55">
      <rect x="190" y="40" width="100" height="2" fill="#c8a96e"/>
      <rect x="190" y="160" width="100" height="2" fill="#c8a96e"/>
      <rect x="190" y="280" width="100" height="2" fill="#c8a96e"/>
      <rect x="190" y="400" width="100" height="2" fill="#c8a96e"/>
      <rect x="190" y="520" width="100" height="2" fill="#c8a96e"/>
    </g>
  </g>
  <!-- palms -->
  <g transform="translate(60,720)" opacity="0.85">
    <line x1="20" y1="0" x2="14" y2="160" stroke="#1a1812" stroke-width="3"/>
    <path d="M20,0 Q-30,-30 -50,10 Q-30,-10 20,0 Z" fill="#2a2418"/>
    <path d="M20,0 Q70,-30 90,10 Q70,-10 20,0 Z" fill="#2a2418"/>
    <path d="M20,0 Q-10,-50 -20,-90 Q5,-50 20,0 Z" fill="#2a2418"/>
  </g>
  <g transform="translate(680,740)" opacity="0.75">
    <line x1="20" y1="0" x2="22" y2="140" stroke="#1a1812" stroke-width="3"/>
    <path d="M20,0 Q-30,-30 -50,10 Q-30,-10 20,0 Z" fill="#2a2418"/>
    <path d="M20,0 Q70,-30 90,10 Q70,-10 20,0 Z" fill="#2a2418"/>
  </g>
  <!-- ground -->
  <rect x="0" y="880" width="800" height="120" fill="#0e0c08"/>
  <rect x="0" y="880" width="800" height="2" fill="#c8a96e" opacity="0.4"/>
</svg>
