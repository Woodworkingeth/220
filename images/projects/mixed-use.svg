<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-mu" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1c1a14"/>
      <stop offset="50%" stop-color="#3d3022"/>
      <stop offset="100%" stop-color="#7a5e3c"/>
    </linearGradient>
    <linearGradient id="stone-mu" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7d6e54"/>
      <stop offset="100%" stop-color="#4a3f2d"/>
    </linearGradient>
    <linearGradient id="glass-mu" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a3022"/>
      <stop offset="100%" stop-color="#1c1810"/>
    </linearGradient>
    <linearGradient id="lit-mu" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd989"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>
    <pattern id="stonePat-mu" x="0" y="0" width="100" height="50" patternUnits="userSpaceOnUse">
      <rect width="100" height="50" fill="url(#stone-mu)"/>
      <rect x="0" y="0" width="50" height="25" fill="#65583f" opacity="0.35"/>
      <rect x="50" y="25" width="50" height="25" fill="#5a4d36" opacity="0.4"/>
      <line x1="0" y1="25" x2="100" y2="25" stroke="#1c1a16" stroke-width="0.4"/>
      <line x1="50" y1="0" x2="50" y2="25" stroke="#1c1a16" stroke-width="0.4"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky-mu)"/>
  <!-- skyline far -->
  <g opacity="0.32">
    <rect x="0" y="540" width="120" height="200" fill="#0e0c08"/>
    <rect x="120" y="500" width="100" height="240" fill="#0e0c08"/>
    <rect x="1380" y="520" width="120" height="220" fill="#0e0c08"/>
    <rect x="1500" y="490" width="100" height="250" fill="#0e0c08"/>
  </g>
  <!-- main mixed-use building (5 stories, corner stone+glass) -->
  <g transform="translate(280,140)">
    <!-- glass mass left -->
    <rect x="0" y="0" width="380" height="600" fill="url(#glass-mu)"/>
    <!-- stone corner mass right -->
    <rect x="380" y="0" width="640" height="600" fill="url(#stonePat-mu)"/>
    <!-- corner expression bar -->
    <rect x="376" y="-8" width="8" height="608" fill="#c8a96e" opacity="0.9"/>
    <!-- top cornice -->
    <rect x="-10" y="-12" width="1040" height="14" fill="#3d3424"/>
    <!-- glass section: 5 floors of windows -->
    <g>
      <g transform="translate(0,30)">
        <rect x="20" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.78"/>
        <rect x="120" y="0" width="80" height="80" fill="url(#glass-mu)"/>
        <rect x="220" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.62"/>
      </g>
      <g transform="translate(0,150)">
        <rect x="20" y="0" width="80" height="80" fill="url(#glass-mu)"/>
        <rect x="120" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.85"/>
        <rect x="220" y="0" width="80" height="80" fill="url(#glass-mu)"/>
      </g>
      <g transform="translate(0,270)">
        <rect x="20" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.7"/>
        <rect x="120" y="0" width="80" height="80" fill="url(#glass-mu)"/>
        <rect x="220" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.78"/>
      </g>
      <g transform="translate(0,390)">
        <rect x="20" y="0" width="80" height="80" fill="url(#glass-mu)"/>
        <rect x="120" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.55"/>
        <rect x="220" y="0" width="80" height="80" fill="url(#glass-mu)"/>
      </g>
      <g transform="translate(0,510)">
        <rect x="20" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.65"/>
        <rect x="120" y="0" width="80" height="80" fill="url(#glass-mu)"/>
        <rect x="220" y="0" width="80" height="80" fill="url(#lit-mu)" opacity="0.7"/>
      </g>
    </g>
    <!-- stone section: balconies + small windows -->
    <g>
      <g transform="translate(420,40)">
        <rect x="0" y="60" width="540" height="6" fill="#3d3424"/>
        <rect x="40" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="160" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.78"/>
        <rect x="280" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="400" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.65"/>
      </g>
      <g transform="translate(420,160)">
        <rect x="0" y="60" width="540" height="6" fill="#3d3424"/>
        <rect x="40" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.85"/>
        <rect x="160" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="280" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.7"/>
        <rect x="400" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
      </g>
      <g transform="translate(420,280)">
        <rect x="0" y="60" width="540" height="6" fill="#3d3424"/>
        <rect x="40" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="160" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.85"/>
        <rect x="280" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="400" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.78"/>
      </g>
      <g transform="translate(420,400)">
        <rect x="0" y="60" width="540" height="6" fill="#3d3424"/>
        <rect x="40" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.6"/>
        <rect x="160" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="280" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.85"/>
        <rect x="400" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
      </g>
      <g transform="translate(420,520)">
        <rect x="40" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="160" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.7"/>
        <rect x="280" y="0" width="80" height="60" fill="#1f1a12" opacity="0.85"/>
        <rect x="400" y="0" width="80" height="60" fill="url(#lit-mu)" opacity="0.55"/>
      </g>
    </g>
    <!-- ground floor entrance -->
    <rect x="0" y="540" width="1020" height="60" fill="#0d0b08"/>
    <rect x="80" y="555" width="240" height="45" fill="url(#lit-mu)" opacity="0.85"/>
    <rect x="600" y="555" width="180" height="45" fill="url(#lit-mu)" opacity="0.7"/>
  </g>
  <!-- foreground palms -->
  <g transform="translate(140,640)" opacity="0.82">
    <line x1="0" y1="0" x2="-6" y2="180" stroke="#0d0b08" stroke-width="4"/>
    <path d="M0,0 Q-50,-40 -90,-10 Q-50,-20 0,0 Z" fill="#1f1a12"/>
    <path d="M0,0 Q50,-40 90,-10 Q50,-20 0,0 Z" fill="#1f1a12"/>
    <path d="M0,0 Q-20,-60 -10,-110 Q5,-60 0,0 Z" fill="#1f1a12"/>
  </g>
  <g transform="translate(1440,660)" opacity="0.78">
    <line x1="0" y1="0" x2="6" y2="160" stroke="#0d0b08" stroke-width="4"/>
    <path d="M0,0 Q-50,-40 -90,-10 Q-50,-20 0,0 Z" fill="#1f1a12"/>
    <path d="M0,0 Q50,-40 90,-10 Q50,-20 0,0 Z" fill="#1f1a12"/>
  </g>
  <!-- ground -->
  <rect x="0" y="740" width="1600" height="160" fill="#0a0805"/>
  <rect x="0" y="740" width="1600" height="2" fill="#c8a96e" opacity="0.45"/>
</svg>
