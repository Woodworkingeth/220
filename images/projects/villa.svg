<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk-v" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1812"/>
      <stop offset="50%" stop-color="#3d3022"/>
      <stop offset="100%" stop-color="#7a5e3c"/>
    </linearGradient>
    <linearGradient id="stone-v" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8a7a5e"/>
      <stop offset="100%" stop-color="#5a4d36"/>
    </linearGradient>
    <linearGradient id="warm-window" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd989"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>
    <pattern id="stone-v-pat" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="url(#stone-v)"/>
      <line x1="0" y1="15" x2="60" y2="15" stroke="#3a3122" stroke-width="0.6"/>
      <line x1="30" y1="0" x2="30" y2="15" stroke="#3a3122" stroke-width="0.6"/>
      <line x1="0" y1="15" x2="0" y2="30" stroke="#3a3122" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#dusk-v)"/>
  <!-- distant landscape -->
  <path d="M0,720 Q200,680 400,710 T800,700 L800,1000 L0,1000 Z" fill="#1f1a12" opacity="0.7"/>
  <!-- driveway/foreground -->
  <rect x="0" y="900" width="800" height="100" fill="#0d0b08"/>
  <!-- main villa structure -->
  <g transform="translate(110,440)">
    <!-- left wing (lower) -->
    <rect x="0" y="120" width="220" height="320" fill="url(#stone-v-pat)"/>
    <rect x="-8" y="116" width="236" height="6" fill="#3d3424"/>
    <!-- big picture window left -->
    <rect x="20" y="160" width="180" height="160" fill="url(#warm-window)" opacity="0.92"/>
    <line x1="80" y1="160" x2="80" y2="320" stroke="#1c1a16" stroke-width="2" opacity="0.35"/>
    <line x1="140" y1="160" x2="140" y2="320" stroke="#1c1a16" stroke-width="2" opacity="0.35"/>
    <!-- right wing (taller) -->
    <rect x="220" y="0" width="360" height="440" fill="url(#stone-v-pat)"/>
    <rect x="216" y="-6" width="368" height="8" fill="#3d3424"/>
    <!-- tall vertical glass column -->
    <rect x="252" y="20" width="80" height="400" fill="#1a1612" opacity="0.85"/>
    <rect x="256" y="40" width="72" height="40" fill="url(#warm-window)" opacity="0.7"/>
    <rect x="256" y="160" width="72" height="40" fill="url(#warm-window)" opacity="0.85"/>
    <rect x="256" y="280" width="72" height="40" fill="url(#warm-window)" opacity="0.6"/>
    <!-- right side windows -->
    <rect x="360" y="60" width="180" height="80" fill="url(#warm-window)" opacity="0.85"/>
    <rect x="360" y="180" width="180" height="80" fill="#1a1612" opacity="0.85"/>
    <rect x="360" y="300" width="180" height="80" fill="url(#warm-window)" opacity="0.78"/>
    <line x1="430" y1="60" x2="430" y2="380" stroke="#1c1a16" stroke-width="1.5" opacity="0.5"/>
    <line x1="500" y1="60" x2="500" y2="380" stroke="#1c1a16" stroke-width="1.5" opacity="0.5"/>
    <!-- entrance / portico -->
    <rect x="180" y="320" width="60" height="120" fill="#0e0c08"/>
    <rect x="190" y="340" width="40" height="100" fill="url(#warm-window)" opacity="0.95"/>
  </g>
  <!-- palm tree -->
  <g transform="translate(620,540)">
    <line x1="0" y1="0" x2="-8" y2="280" stroke="#1a1410" stroke-width="5"/>
    <g opacity="0.95">
      <path d="M0,0 Q-50,-50 -100,-30 Q-50,-30 0,0 Z" fill="#1f1a12"/>
      <path d="M0,0 Q50,-50 100,-30 Q50,-30 0,0 Z" fill="#1f1a12"/>
      <path d="M0,0 Q-30,-80 -40,-130 Q0,-80 0,0 Z" fill="#1f1a12"/>
      <path d="M0,0 Q30,-80 40,-130 Q0,-80 0,0 Z" fill="#1f1a12"/>
      <path d="M0,0 Q-70,-30 -120,0 Q-70,-15 0,0 Z" fill="#1f1a12"/>
    </g>
  </g>
  <!-- pool reflection / line -->
  <rect x="0" y="894" width="800" height="2" fill="#c8a96e" opacity="0.35"/>
  <rect x="120" y="908" width="540" height="40" fill="#1a1410" opacity="0.6"/>
  <rect x="120" y="908" width="540" height="2" fill="#c8a96e" opacity="0.55"/>
</svg>
